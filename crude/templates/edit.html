<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Edit Product details</title>
</head>
<body>
    <form action="{% url 'edit_details' product.id %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
    <div class="container-fluid">
        <br><br><br><br>
        <h1 class="text-center text-danger"><i>EDIT SECTION</i></h1><br>
        <div class="row justify-content-center bg-white">
            <div class="col-md-6">
                <form id="productform">
                    <div class="form-group">
                        <label for="productname">Change Product Name:</label>
                        <input type="text" class="form-control" id="productname" name="pdtname" required value="{{ product.productname }}">
                    </div>
                    <div class="form-group"> 
                        <label for="description">Change Description:</label>
                        <input type="text" class="form-control" id="description" name="des" required value="{{ product.description }}">
                    </div>
                    <div class="form-group">
                        <label for="quantity">Change Quantity:</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" required value="{{ product.quantity }}">
                    </div>
                    <div class="form-group">
                        <label for="price">Alter Price:</label>
                        <input type="number" class="form-control" id="price" name="price" required value="{{ product.price }}">
                    </div>
                    <div class="form-group">
                        <label for="Photo">Alter Photo:</label>
                        <img src="{{ product.image.url }}" alt="" height="100" width="100">
                        <input type="file" class="form-control"  name="photo" id="photo">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Submit</button>
                </form>
            </div>
        </div>
    </div>
    </form>
</body>
</html>
