<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Product</title>
</head>
<body>
    <nav class="navbar bg-dark navbar-expand-sm">  
        <a href="" class="navbar-brand">CRUD </a>
       <ul class="navbar-nav ml-auto">
        <li class="nav-item">
            <a href="{% url 'show' %}" class="nav-link">Show</a>
        </li>
       </ul>
    </nav>

    <form action="{% url 'add_details' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
    <div class="container-fluid">
        <br><br><br><br>
        <h1 class="text-center text-danger"><i>PRODUCT DETAILS</i></h1><br>
        <div class="row justify-content-center bg-white">
            <div class="col-md-6">
                <form id="productform">
                    <div class="form-group">
                        <label for="productname">Product Name:</label>
                        <input type="text" class="form-control" id="productname" name="pdtname" required>
                    </div>
                    <div class="form-group"> 
                        <label for="description">Description:</label>
                        <input type="text" class="form-control" id="description" name="des" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price:</label>
                        <input type="number" class="form-control" id="price" name="price" required>
                    </div>
                    <div class="form-group">
                        <label for="photo">upload image:</label>
                        <input type="file" class="form-control" id="photo" name="photo" required accept="image/">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Submit</button>
                </form>
            </div>
        </div>
    </div>
    </form>
</body>
</html>
